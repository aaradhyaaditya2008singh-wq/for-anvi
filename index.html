<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    overflow: hidden;
}

/* HEART BACKGROUND */
.hearts {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    overflow: hidden;
    z-index: 0;
}

.hearts span {
    position: absolute;
    color: rgba(255, 0, 100, 0.5);
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh) scale(0.5);}
    100% {transform: translateY(-10vh) scale(1.5);}
}

/* PAGE (FLIP EFFECT) */
.page {
    position: absolute;
    width: 80%;
    max-width: 500px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotateY(90deg);
    background: #111;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,0,100,0.3);
    opacity: 0;
    transition: 0.6s;
    z-index: 2;
}

.page.active {
    transform: translate(-50%, -50%) rotateY(0deg);
    opacity: 1;
}

/* BUTTON */
button {
    margin-top: 15px;
    padding: 10px 15px;
    border: none;
    background: crimson;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* TYPING EFFECT */
.typing {
    white-space: pre-line;
    border-right: 2px solid white;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { border-color: transparent; }
}
</style>

</head>

<body>

<div class="hearts" id="hearts"></div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
<h2>Dear Anvi 🤍</h2>
<p class="typing" id="text1"></p>
<button onclick="nextPage(2)">Next ➜</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
<h2>A Little Note 🌸</h2>
<p class="typing" id="text2"></p>
<button onclick="nextPage(3)">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
<h2>For Your Future 🦋</h2>
<p class="typing" id="text3"></p>
<button onclick="nextPage(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
<h2>🖤 4 Promises By Me 🤍</h2>
<p class="typing" id="text4"></p>
</div>

<script>

/* HEARTS */
function createHearts() {
    const hearts = document.getElementById("hearts");
    for(let i=0;i<25;i++){
        let span = document.createElement("span");
        span.innerHTML = "❤";
        span.style.left = Math.random()*100 + "%";
        span.style.animationDuration = (3 + Math.random()*5) + "s";
        span.style.fontSize = (10 + Math.random()*20) + "px";
        hearts.appendChild(span);
    }
}
createHearts();

/* TYPING EFFECT */
function typeText(id, text, speed=20){
    let i = 0;
    function typing(){
        if(i < text.length){
            document.getElementById(id).innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

/* TEXT CONTENT */
typeText("text1",
`Thank you for always being there for me.
Thank you for listening, caring and supporting me.

You always make my bad days better.
I'm really grateful to have you in my life.

✨ Some friends make the world brighter ✨`);

typeText("text2",
`I don't know how long we'll stay connected,
but I always want you to be happy.

Your smile means a lot.
I never want to see you sad 🤍`);

typeText("text3",
`May you achieve every dream you have.
Make your parents proud.

I'll always pray for your happiness,
success and peace ✨`);

typeText("text4",
`1. I will never leave you alone.
2. I will always listen to you.
3. I will never judge you.
4. I will always try to make you smile.

✨ These are my real promises ✨`);

/* PAGE CHANGE + FLIP */
function nextPage(num){
    let pages = document.querySelectorAll(".page");
    pages.forEach(p => p.classList.remove("active"));
    document.getElementById("page"+num).classList.add("active");
}

</script>

</body>
</html>
