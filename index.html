<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    overflow: hidden;
}

/* HEART BACKGROUND */
.hearts {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    overflow: hidden;
    z-index: 0;
}

.hearts span {
    position: absolute;
    color: rgba(255, 0, 100, 0.5);
    font-size: 18px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh);}
    100% {transform: translateY(-10vh);}
}

/* PAGE STYLE */
.page {
    position: absolute;
    width: 85%;
    max-width: 520px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotateY(90deg);
    background: #111;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255,0,100,0.3);
    opacity: 0;
    transition: 0.6s;
    z-index: 2;
    height: 70vh;
    overflow-y: auto;
}

.page.active {
    transform: translate(-50%, -50%) rotateY(0deg);
    opacity: 1;
}

/* BUTTON */
button {
    margin-top: 15px;
    padding: 10px 15px;
    border: none;
    background: crimson;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* TYPING */
.typing {
    white-space: pre-line;
    line-height: 1.6;
}
</style>

</head>

<body>

<div class="hearts" id="hearts"></div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
<h2>Dear Anvi 🤍</h2>
<p class="typing" id="text1"></p>
<button onclick="nextPage(2)">Next ➜</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
<h2>A Little Note 🌸</h2>
<p class="typing" id="text2"></p>
<button onclick="nextPage(3)">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
<h2>For Your Future 🦋</h2>
<p class="typing" id="text3"></p>
<button onclick="nextPage(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
<h2>🖤 4 Promises By Me 🤍</h2>
<p class="typing" id="text4"></p>
</div>

<script>

/* HEARTS */
function createHearts(){
    const hearts = document.getElementById("hearts");
    for(let i=0;i<30;i++){
        let s = document.createElement("span");
        s.innerHTML = "❤";
        s.style.left = Math.random()*100 + "%";
        s.style.animationDuration = (3 + Math.random()*5) + "s";
        s.style.fontSize = (10 + Math.random()*20) + "px";
        hearts.appendChild(s);
    }
}
createHearts();

/* PAGE SWITCH */
function nextPage(num){
    document.querySelectorAll(".page").forEach(p=>{
        p.classList.remove("active");
    });
    document.getElementById("page"+num).classList.add("active");
}

/* TYPE FUNCTION */
function typeText(id, text, speed=15){
    let i = 0;
    function typing(){
        if(i < text.length){
            document.getElementById(id).innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

/* FULL ORIGINAL TEXT */

/* PAGE 1 */
typeText("text1", `Thank you for always being there for me.
Thank you for always listening to me,
caring for me, supporting me,
and never judging me.

No matter what I am going through,
you always make time to hear me out,
and that means more than I can express in words.

Talking to you makes even difficult days feel lighter.
I'm truly grateful to have a friend like you in my life.

✨ Some friends make the world brighter just by being in it. ✨`);

/* PAGE 2 */
typeText("text2", `I don't know how long you'll stay in my life,
and I don't know how long we'll keep talking.

But I do know one thing —
as long as you're here,
I want to see you happy.

I never want to see you sad.
Your smile deserves to stay exactly where it belongs —
on your face. 🤍

Thank you for being such an important part
of my life.`);

/* PAGE 3 */
typeText("text3", `May you achieve every dream you work for.

May you make your parents proud
and become the amazing person
you're meant to be.

No matter where life takes us,
I'll always pray for your happiness,
success and peace.

Keep shining, Anvi. ✨`);

/* PAGE 4 */
typeText("text4", `🖤 4 Promises By Me 🤍

1. I will never leave you feeling alone.
Whenever you need someone to talk to,
I'll do my best to be there for you.

2. I will always be ready to listen
to your problems, worries and thoughts,
just like you've listened to mine.

3. I will never judge you for who you are.
You can always be yourself around me.

4. I will always try my best
to keep a smile on your face
and support you through both good days
and difficult ones.

✨ These are not just words,
but promises from a grateful friend.`);

</script>

</body>
</html>
