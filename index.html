<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anvi 💌</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#fff5fa);
font-family:sans-serif;
overflow:hidden;
}

.envelope{
font-size:120px;
cursor:pointer;
transition:0.3s;
}

.envelope:hover{
transform:scale(1.1);
}

.letter{
display:none;
background:white;
width:320px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
text-align:center;
}

h2{
color:#ff5c8a;
}

.heart{
position:absolute;
font-size:20px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-100px);opacity:0;}
}
</style>
</head>

<body>

<div id="envelope" class="envelope" onclick="openLetter()">
💌
<p style="font-size:18px;">Tap to open</p>
</div>

<div id="letter" class="letter">
<h2>Dear Anvi 🤍</h2>

<p>
Thank you for always listening to me,
supporting me, and never judging me.

Talking to you makes even difficult days feel lighter.
I'm really grateful to have a friend like you.

✨ Some friends make the world brighter just by being in it. ✨
</p>
</div>

<script>
function openLetter(){
document.getElementById("envelope").style.display="none";
document.getElementById("letter").style.display="block";
}

for(let i=0;i<25;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(heart);
}
</script>

</body>
</html>
